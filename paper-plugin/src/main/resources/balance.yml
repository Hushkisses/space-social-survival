match:
  target-minutes: 45

return:
  hold-seconds: 240

map:
  min-tiles: 10
  max-tiles: 14
  max-dead-ends: 6
  max-core-distance: 6
  max-attempts: 500

objectives:
  secret-mission-chance-percent: 50

# Playability-phase tuning. These values intentionally start below the
# current survival-system thresholds so the opening recovery phase cannot
# be skipped. Tune from playtest evidence; they are not final balance.
starting-ship:
  power: 35
  oxygen: 40
  hull: 38
  reactor: 30

# Shared emergency reserve used by the opening recovery loop.
# Random physical caches remain separate and still matter later.
starting-shared-resources:
  repair-parts: 4
  power-cells: 2
  fuel: 2
  medical-supplies: 2

events:
  initial-small-min: 2
  initial-small-max: 3

scenario:
  accident-weight: 45
  sabotage-weight: 35
  infection-weight: 20

incident:
  small-min-seconds: 180
  small-max-seconds: 360
  major-first-min-seconds: 1080
  major-first-max-seconds: 1440
  major-second-min-seconds: 1920
  major-second-max-seconds: 2280
